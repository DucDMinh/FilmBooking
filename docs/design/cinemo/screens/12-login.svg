<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
<defs>
        <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#311C39"/><stop offset=".52" stop-color="#171D32"/><stop offset="1" stop-color="#10131C"/></linearGradient>
        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6B56"/><stop offset="1" stop-color="#E63C58"/></linearGradient>
        <linearGradient id="poster1" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F2A65A"/><stop offset=".5" stop-color="#A64D58"/><stop offset="1" stop-color="#261B35"/></linearGradient>
        <linearGradient id="poster2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#294C60"/><stop offset=".55" stop-color="#4D6D76"/><stop offset="1" stop-color="#171C2D"/></linearGradient>
        <linearGradient id="poster3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#624D91"/><stop offset=".5" stop-color="#C16A83"/><stop offset="1" stop-color="#23223B"/></linearGradient>
        <linearGradient id="poster4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1C7775"/><stop offset=".55" stop-color="#E1B46A"/><stop offset="1" stop-color="#172338"/></linearGradient>
        <linearGradient id="poster5" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#BE5446"/><stop offset=".5" stop-color="#563D62"/><stop offset="1" stop-color="#111727"/></linearGradient>
        <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity=".26"/></filter>
        </defs>
<rect width="100%" height="100%" fill="#0B0D12"/>
<rect x="0" y="0" width="1440" height="1000" rx="0" fill="url(#hero)" stroke="none" stroke-width="1" opacity="1"/>
<circle cx="1130" cy="220" r="250" fill="#352B42" stroke="none" stroke-width="1"/>
<circle cx="1130" cy="220" r="180" fill="#503847" stroke="none" stroke-width="1"/>
<text x="80" y="85" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="26" font-weight="850" fill="#FFFFFF" text-anchor="start" opacity="1">CINEMO</text>
<text x="80" y="360" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" text-anchor="start" opacity="1">Một thế giới phim ảnh</text>
<text x="80" y="410" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="18" font-weight="450" fill="#CFD4DE" text-anchor="start" opacity="1">Chọn rạp yêu thích. Chọn ghế của bạn.</text>
<text x="80" y="442" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="18" font-weight="450" fill="#CFD4DE" text-anchor="start" opacity="1">Và tận hưởng những khoảnh khắc đáng nhớ.</text>
<rect x="760" y="100" width="560" height="800" rx="16" fill="#111722" stroke="#303847" stroke-width="1" opacity="1"/>
<text x="820" y="165" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="start" opacity="1">Chào mừng trở lại</text>
<text x="820" y="197" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="13" font-weight="450" fill="#9CA6B5" text-anchor="start" opacity="1">Đăng nhập để tiếp tục đặt vé.</text>
<text x="820" y="243" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="12" font-weight="600" fill="#AAB1BF" text-anchor="start" opacity="1">Email</text>
<rect x="820" y="253" width="440" height="47" rx="10" fill="#121721" stroke="#303746" stroke-width="1" opacity="1"/>
<text x="834" y="281" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="13" font-weight="400" fill="#E8EBF0" text-anchor="start" opacity="1">duc.nguyen@email.com</text>
<text x="820" y="333" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="12" font-weight="600" fill="#AAB1BF" text-anchor="start" opacity="1">Mật khẩu</text>
<rect x="820" y="343" width="440" height="47" rx="10" fill="#121721" stroke="#303746" stroke-width="1" opacity="1"/>
<text x="834" y="371" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="13" font-weight="400" fill="#E8EBF0" text-anchor="start" opacity="1">••••••••••</text>
<text x="1260" y="420" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="11" font-weight="600" fill="#FF9B87" text-anchor="end" opacity="1">Quên mật khẩu?</text>
<rect x="820" y="440" width="18" height="18" rx="4" fill="#202735" stroke="#596273" stroke-width="1" opacity="1"/>
<text x="847" y="454" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="11" font-weight="450" fill="#ADB6C4" text-anchor="start" opacity="1">Ghi nhớ đăng nhập</text>
<rect x="820" y="485" width="440" height="48" rx="12" fill="url(#accent)" stroke="none" stroke-width="1" opacity="1"/>
<text x="1040.0" y="514.0" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="13" font-weight="650" fill="#FFFFFF" text-anchor="middle" opacity="1">Đăng nhập</text>
<line x1="820" y1="565" x2="1010" y2="565" stroke="#303846" stroke-width="1"/>
<text x="1040" y="569" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="9" font-weight="650" fill="#778292" text-anchor="middle" opacity="1">HOẶC</text>
<line x1="1070" y1="565" x2="1260" y2="565" stroke="#303846" stroke-width="1"/>
<rect x="820" y="590" width="440" height="46" rx="12" fill="#202634" stroke="#343B49" stroke-width="1" opacity="1"/>
<text x="1040.0" y="618.0" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="13" font-weight="650" fill="#E5E8EE" text-anchor="middle" opacity="1">G  Tiếp tục với Google</text>
<rect x="820" y="650" width="440" height="46" rx="12" fill="#202634" stroke="#343B49" stroke-width="1" opacity="1"/>
<text x="1040.0" y="678.0" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="13" font-weight="650" fill="#E5E8EE" text-anchor="middle" opacity="1">f  Tiếp tục với Facebook</text>
<text x="1040" y="740" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="12" font-weight="500" fill="#C1C8D2" text-anchor="middle" opacity="1">Chưa có tài khoản?  Đăng ký ngay</text>
<text x="1040" y="820" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="9" font-weight="400" fill="#727E8E" text-anchor="middle" opacity="1">Bằng việc tiếp tục, bạn đồng ý với Điều khoản &amp; Chính sách bảo mật.</text>
</svg>