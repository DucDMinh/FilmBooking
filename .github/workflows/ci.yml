name: CI

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Phiên bản pnpm lấy từ "packageManager" trong root package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w lint
      - run: pnpm -w typecheck
      - run: pnpm -w test
      - run: pnpm -w build

  db-test:
    name: db (supabase start + pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Giá trị giả chỉ để config.toml (env(...)) hợp lệ khi `supabase start`; KHÔNG phải secret.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_FACEBOOK_CLIENT_ID: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_FACEBOOK_SECRET: ci-placeholder
      TURNSTILE_SECRET_KEY: ci-placeholder
      RESEND_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      # Phiên bản pnpm lấy từ "packageManager" trong root package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:start
      - run: pnpm db:test
      - name: Stop Supabase
        if: always()
        run: pnpm db:stop
